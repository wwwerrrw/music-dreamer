server:
  port: ${MUSIC_DREAMER_INTERACTION_PORT:8084}

spring:
  application:
    name: interaction-service
  datasource:
    url: ${MUSIC_DREAMER_INTERACTION_JDBC_URL:jdbc:mysql://127.0.0.1:3306/music_dreamer_interaction?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${MUSIC_DREAMER_INTERACTION_DB_USERNAME:music_dreamer_interaction_app}
    password: ${MUSIC_DREAMER_INTERACTION_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration/interaction
    baseline-on-migrate: true
    baseline-version: 1
  cloud:
    nacos:
      discovery:
        server-addr: ${MUSIC_DREAMER_NACOS_SERVER:127.0.0.1:8848}
