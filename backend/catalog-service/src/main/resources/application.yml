server:
  port: ${MUSIC_DREAMER_CATALOG_PORT:8082}

spring:
  application:
    name: catalog-service
  datasource:
    url: ${MUSIC_DREAMER_CATALOG_JDBC_URL:jdbc:mysql://127.0.0.1:3306/music_dreamer_catalog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${MUSIC_DREAMER_CATALOG_DB_USERNAME:music_dreamer_catalog_app}
    password: ${MUSIC_DREAMER_CATALOG_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration/catalog
    baseline-on-migrate: true
    baseline-version: 1
  cloud:
    nacos:
      discovery:
        server-addr: ${MUSIC_DREAMER_NACOS_SERVER:127.0.0.1:8848}
