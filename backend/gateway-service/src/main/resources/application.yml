server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${MUSIC_DREAMER_REDIS_HOST:127.0.0.1}
      port: ${MUSIC_DREAMER_REDIS_PORT:6380}
  cloud:
    nacos:
      discovery:
        server-addr: ${MUSIC_DREAMER_NACOS_SERVER:127.0.0.1:8848}
    gateway:
      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/identity/**
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/catalog/**
        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/media/**
        - id: interaction-service
          uri: lb://interaction-service
          predicates:
            - Path=/api/interaction/**

music-dreamer:
  gateway:
    redis-namespace: music-dreamer
