server:
  port: ${MUSIC_DREAMER_MEDIA_PORT:8083}

spring:
  application:
    name: media-service
  datasource:
    url: ${MUSIC_DREAMER_MEDIA_JDBC_URL:jdbc:mysql://127.0.0.1:3306/music_dreamer_media?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${MUSIC_DREAMER_MEDIA_DB_USERNAME:music_dreamer_media_app}
    password: ${MUSIC_DREAMER_MEDIA_DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: ${MUSIC_DREAMER_MEDIA_MAX_FILE_SIZE:50MB}
      max-request-size: ${MUSIC_DREAMER_MEDIA_MAX_REQUEST_SIZE:50MB}
  flyway:
    enabled: true
    locations: classpath:db/migration/media
    baseline-on-migrate: true
    baseline-version: 1
  cloud:
    nacos:
      discovery:
        server-addr: ${MUSIC_DREAMER_NACOS_SERVER:127.0.0.1:8848}

music-dreamer:
  media:
    storage-root: ${MUSIC_DREAMER_MEDIA_STORAGE_ROOT:E:/Zmkk/music-dreamer-media}
    max-file-bytes: ${MUSIC_DREAMER_MEDIA_MAX_FILE_BYTES:52428800}
